# Bronze ingestion: full parallelism = one task per object.
# Task 1: discover_objects loads registry and sets task value "object_ids".
# Task 2: For-each over object_ids; each iteration runs one object (no serial processing within a shard).
# Set concurrency to limit how many objects run at once (e.g. 20–30).

resources:
  jobs:
    bronze_ingestion_parallel_by_object:
      name: bronze_ingestion_parallel_by_object
      max_concurrent_runs: 1
      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster:
            node_type_id: i3.xlarge
            spark_version: 13.3.x-scala2.12
            num_workers: 1
      tasks:
        - task_key: discover_objects
          job_cluster_key: job_cluster
          notebook_task:
            notebook_path: ../notebooks/09_discover_object_ids
            base_parameters:
              TARGET_ENV: "dev"
              LAYER: "bronze"
              SCHEDULE_GROUP: "P0_bigquery"
              REGISTRY_PATH: "abfss://config@<storage>.dfs.core.windows.net/compiled/dev/users/<alias>/latest/compiled_registry.json"
        - task_key: bronze_for_each_object
          depends_on:
            - task_key: discover_objects
          for_each_task:
            inputs: "{{tasks.discover_objects.values.object_ids}}"
            concurrency: 20
            task:
              task_key: run_one_object
              job_cluster_key: job_cluster
              notebook_task:
                notebook_path: ../notebooks/10_run_ingestion_group
                base_parameters:
                  TARGET_ENV: "dev"
                  LAYER: "bronze"
                  SCHEDULE_GROUP: "P0_bigquery"
                  REGISTRY_PATH: "abfss://config@<storage>.dfs.core.windows.net/compiled/dev/users/<alias>/latest/compiled_registry.json"
                  CONFIG_VERSION: "unknown"
                  STRICT_MODE: "false"
                  OBJECT_ID: "{{input}}"
